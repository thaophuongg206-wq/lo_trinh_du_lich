<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Du Lịch Thông Minh</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid h-100">
        <div class="row h-100">
            
            <!-- PANEL BÊN TRÁI -->
            <div class="col-md-4 col-lg-3 sidebar p-4 shadow">
                <h2 class="brand-title mb-4"><i class="fa-solid fa-route"></i> Lập Lịch Trình</h2>
                
                <div class="card mb-4 shadow-sm">
                    <div class="card-header bg-custom text-white">
                        <i class="fa-regular fa-clock"></i> Khung thời gian (Time-Window)
                    </div>
                    <div class="card-body">
                        <div class="row g-2">
                            <div class="col-6">
                                <label class="form-label">Giờ bắt đầu</label>
                                <input type="time" id="start_time" class="form-control" value="08:00">
                            </div>
                            <div class="col-6">
                                <label class="form-label">Giờ kết thúc</label>
                                <input type="time" id="end_time" class="form-control" value="12:00">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-custom text-white">
                        <i class="fa-solid fa-map-location-dot"></i> Chọn khu vực
                    </div>
                    <div class="card-body p-3">
                        <label class="form-label text-muted" style="font-size: 0.9rem;">Khu vực bạn muốn khám phá:</label>
                        <select id="main_location" class="form-select shadow-sm border-0 bg-light">
                            <option value="Hanoi" selected>Thủ đô Hà Nội (30 địa điểm)</option>
                            <!-- Có thể mở rộng Đà Nẵng, TP.HCM sau này -->
                        </select>
                    </div>
                </div>

                <button id="btn-optimize" class="btn btn-warning w-100 fw-bold shadow-sm p-3 rounded-pill btn-vintage">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Tìm lộ trình tối ưu
                </button>
            </div>

            <!-- PANEL BÊN PHẢI -->
            <div class="col-md-8 col-lg-9 p-0 main-view position-relative">
                <div id="map" class="h-100 w-100"></div>
                
                <div id="result-panel" class="card shadow result-card fade-in d-none">
                    <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
                        <span><i class="fa-solid fa-timeline"></i> Đề Xuất Lộ Trình</span>
                    </div>
                    <div class="card-body">
                        <!-- Dropdown để chuyển đổi giữa các Lộ trình được sinh ra -->
                        <select id="route_selector" class="form-select form-select-sm mb-3 shadow-sm font-weight-bold" style="border-color: #d87c4f;"></select>
                        
                        <div id="metrics-info" class="alert py-2 mb-3" style="font-size: 0.9rem;"></div>
                        <ul id="timeline-list" class="timeline-ui"></ul>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
