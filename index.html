<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Travel Routing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MÀN HÌNH 1: NHẬP LIỆU TRUNG TÂM -->
    <div id="hero-section">
        <div class="text-center mb-4">
            <i class="fa-solid fa-plane-departure fa-3x" style="color: #d87c4f;"></i>
            <h1 class="fw-bold mt-3" style="color: #2D3748;">Hành trình của riêng bạn</h1>
            <p class="text-muted fs-5">Hãy để AI thiết kế lộ trình hoàn hảo nhất cho bạn tại Hà Nội</p>
        </div>

        <div class="search-box">
            <textarea id="user_preference" class="form-control border-0 bg-light fs-5 mb-4" rows="2" style="resize: none;" placeholder="Bạn muốn đi đâu? Ví dụ: Tạo cho tôi lộ trình tham quan Hà Nội trong vòng 12 tiếng..."></textarea>
            
            <div class="row g-3 mb-4">
                <div class="col-md-2">
    <label class="form-label text-muted small fw-bold"><i class="fa-regular fa-calendar"></i> Ngày đi</label>
    <input type="date" id="trip_date" class="form-control bg-light border-0 px-2">
</div>
<div class="col-md-4">
    <label class="form-label text-muted small fw-bold"><i class="fa-regular fa-clock"></i> Khung giờ</label>
    <div class="d-flex align-items-center">
        <input type="time" id="start_time" class="form-control bg-light border-0 px-1 text-center" value="08:00">
        <span class="mx-1 text-muted">-</span>
        <input type="time" id="end_time" class="form-control bg-light border-0 px-1 text-center" value="20:00">
    </div>
</div>
<div class="col-md-3">
    <label class="form-label text-muted small fw-bold"><i class="fa-solid fa-motorcycle"></i> Phương tiện</label>
    <select id="vehicle_type" class="form-select bg-light border-0">
        <option value="xe_may" selected>Xe máy</option>
        <option value="o_to">Ô tô cá nhân</option>
        <option value="xe_16_cho">Xe 16 chỗ</option>
        <option value="xe_29_cho">Xe 29 chỗ</option>
        <option value="di_bo">Đi bộ</option>
    </select>
</div>
<div class="col-md-3">
    <label class="form-label text-muted small fw-bold"><i class="fa-solid fa-location-dot"></i> Điểm xuất phát</label>
    <input type="text" id="start_point" class="form-control bg-light border-0" placeholder="Nhập địa chỉ...">
    <a href="#" id="btn-use-location" class="text-success small text-decoration-none fw-bold"><i class="fa-solid fa-crosshairs"></i> Dùng GPS</a>
</div>
            </div>

            <button id="btn-ask-ai" class="btn btn-dark w-100 py-3 rounded-pill fw-bold fs-5 shadow">
                <i class="fa-solid fa-wand-magic-sparkles me-2"></i> Lên lịch trình bằng AI
            </button>
        </div>
    </div>

    <!-- MÀN HÌNH 2: CHATBOT KẾT QUẢ -->
    <div id="chat-section">
        <div class="container" style="max-width: 900px;">
            <div class="d-flex align-items-center mb-4">
                <div class="rounded-circle bg-white shadow-sm p-3 me-3"><i class="fa-solid fa-robot fa-2x" style="color: #d87c4f;"></i></div>
                <h3 class="fw-bold mb-0">Trợ Lý AI</h3>
            </div>
            
            <div class="ai-message mb-5" id="ai-advice-content"></div>
            
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-map-pin text-danger"></i> Các điểm đến gợi ý:</h5>
            <div class="row g-4 mb-5" id="ai-places-grid">
                <!-- Javascript sẽ vẽ các Card ảnh + Rating vào đây -->
            </div>

            <div class="d-flex gap-3 justify-content-center">
                <button id="btn-reject-route" class="btn btn-outline-dark px-4 py-2 rounded-pill fw-bold">
                    <i class="fa-solid fa-rotate-right"></i> Nghĩ lộ trình khác
                </button>
                <button id="btn-accept-route" class="btn btn-success px-5 py-2 rounded-pill fw-bold shadow">
                    <i class="fa-solid fa-check me-2"></i> Chốt lộ trình & Vẽ bản đồ
                </button>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH 3: BẢN ĐỒ LỘ TRÌNH -->
    <div id="map-section">
        <div id="map"></div>
        <div class="route-sidebar">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0"><i class="fa-solid fa-route" style="color: #d87c4f;"></i> Lộ trình</h4>
                <button id="btn-back-chat" class="btn btn-sm btn-light rounded-circle"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="metrics-info" class="alert alert-info border-0 rounded-3 small fw-medium"></div>
            <ul id="timeline-list" class="timeline-ui mt-4"></ul>
        </div>
    </div>

    <!-- NÚT ẨN ADMIN -->
    <div class="admin-trigger" data-bs-toggle="modal" data-bs-target="#adminModal"><i class="fa-solid fa-gear"></i></div>

    <!-- MODAL ADMIN IMPORT -->
    <div class="modal fade" id="adminModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white"><h5 class="modal-title">Admin: Import Dữ liệu</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <input type="file" id="excel_file" class="form-control mb-3" accept=".xlsx, .xls, .csv">
                    <button id="btn-upload-excel" class="btn btn-primary w-100"><i class="fa-solid fa-cloud-arrow-up"></i> Tải lên Database</button>
                    <div id="upload-status" class="mt-3 text-center fw-bold"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
